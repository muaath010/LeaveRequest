<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاستئذان | مدرسة محمد بن سليمان الغافري</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.ibb.co/pD8X3mw/logo.jpg">
    <meta name="theme-color" content="#800000">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #fffaf0; scroll-behavior: smooth; }
        .glass { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.3); }
        .red-gradient { background: linear-gradient(135deg, #800000 0%, #b91c1c 100%); }
        .hidden { display: none !important; }
        @media (max-width: 640px) { .hide-on-mobile { display: none; } }
        @keyframes pulse-gold {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(234, 179, 8, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }
        .logo-pulse { animation: pulse-gold 2s infinite; border: 2px solid #eab308; }
        #sig-canvas { touch-action: none; } /* يمنع تحرك الشاشة عند التوقيع بالجوال */
    </style>
</head>

            </div>
            <div class="flex gap-2">
                <button onclick="showSection('user-form')" class="px-3 py-1 hover:bg-red-800 rounded-lg text-sm transition">تقديم طلب</button>
                <button onclick="showSection('employee-check')" class="px-3 py-1 bg-white text-red-900 font-bold hover:bg-gray-200 rounded-lg text-sm shadow-md transition">طلباتي</button>
                <button onclick="showAdminLogin()" class="px-3 py-1 bg-yellow-500 text-red-900 font-bold hover:bg-yellow-400 rounded-lg text-sm shadow-md transition">المدير</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto mt-6 px-4 pb-12">
        
        <section id="user-form" class="section-content">
            <div class="max-w-3xl mx-auto glass p-6 md:p-10 rounded-2xl shadow-2xl border-t-8 border-red-900">
                <div class="text-center mb-6">
                    <h2 class="text-2xl md:text-3xl font-bold text-red-900">إستئذان إلكتروني</h2>
                    <p class="text-yellow-700 font-bold mt-2">رقم الطلب: <span id="perm-id" class="font-mono text-red-600">---</span></p>
                </div>

                <div class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="emp-id" placeholder="رقم الموظف" class="p-3 border-2 border-red-50 rounded-xl focus:border-yellow-500 outline-none">
                        <input type="date" id="req-date" class="p-3 border-2 border-red-50 rounded-xl outline-none">
                    </div>

                    <div class="bg-yellow-50 p-5 rounded-xl border border-yellow-200">
                        <select id="leave-type" class="w-full p-3 border-2 border-yellow-300 rounded-lg mb-4 font-bold text-red-900" onchange="toggleTimeFields()">
                            <option value="late">التأخر عن الدوام الرسمي</option>
                            <option value="during">الخروج من الدوام والعودة</option>

                        </select>

                        <div id="time-inputs" class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-red-800 mb-1">من الساعة:</label>
                                <input type="time" id="time-from" class="w-full p-2 border border-yellow-300 rounded-lg outline-none">
                            </div>
                            <div id="div-to" class="hidden">
                                <label class="block text-xs font-bold text-red-800 mb-1">إلى الساعة:</label>
                                <input type="time" id="time-to" class="w-full p-2 border border-yellow-300 rounded-lg outline-none">
                            </div>
                        </div>
                    </div>

                    <textarea id="reason" rows="3" class="w-full p-3 border-2 border-red-50 rounded-xl outline-none focus:border-yellow-500" placeholder="اذكر سبب الاستئذان هنا..."></textarea>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <input type="text" id="emp-name" placeholder="اسم الموظف" class="p-2 border rounded-lg outline-none">
                        <input type="text" id="emp-job" placeholder="الوظيفة" class="p-2 border rounded-lg outline-none">
                        <input type="text" id="emp-file" placeholder="رقم الملف" class="p-2 border rounded-lg outline-none">
                    </div>

                    <div class="mt-4 bg-gray-50 p-4 rounded-xl border-2 border-gray-200">
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-sm font-bold text-gray-700">توقيع الموظف (اختياري):</label>
                            <div class="flex gap-2 items-center">
                                <span class="text-xs text-gray-500">لون الحبر:</span>
                                <button type="button" onclick="changeInk('#000080', this)" class="ink-btn w-6 h-6 rounded-full bg-blue-900 shadow-inner ring-2 ring-offset-2 ring-blue-900"></button>
                                <button type="button" onclick="changeInk('#000000', this)" class="ink-btn w-6 h-6 rounded-full bg-black shadow-inner"></button>
                            </div>
                        </div>
                        <div class="relative bg-white border-2 border-dashed border-gray-300 rounded-lg overflow-hidden">
                            <canvas id="sig-canvas" class="w-full h-32 cursor-crosshair"></canvas>
                            <button type="button" onclick="clearSignature()" class="absolute top-2 left-2 bg-red-100 text-red-700 hover:bg-red-200 px-3 py-1 rounded shadow text-xs font-bold transition">مسح التوقيع</button>
                        </div>
                    </div>

                    <button id="btn-submit" onclick="submitRequest()" class="w-full red-gradient text-white py-4 rounded-xl font-bold text-xl shadow-lg active:scale-95 transition mt-4">إرسال الطلب للاعتماد </button>
                </div>
            </div>
        </section>

        <section id="employee-check" class="section-content hidden">
            <div class="max-w-4xl mx-auto glass p-6 rounded-2xl shadow-2xl border-t-8 border-red-900">
                <h2 class="text-2xl font-bold text-red-900 mb-6 text-center">أرشيف الاستئذانات</h2>
                <div class="flex flex-col md:flex-row gap-3 mb-8">
                    <input type="text" id="check-emp-id" placeholder="أدخل رقمك الوظيفي للبحث..." class="flex-1 p-3 border-2 border-gray-200 rounded-xl outline-none focus:border-yellow-500">
                    <button onclick="loadEmployeeHistory()" class="bg-red-900 text-white px-8 py-3 rounded-xl font-bold hover:bg-red-800 transition shadow-md">بحث في السجلات</button>
                </div>
                <div id="employee-results" class="overflow-x-auto"></div>
            </div>
        </section>

        <section id="admin-login" class="section-content hidden">
            <div class="max-w-md mx-auto glass p-10 rounded-2xl shadow-2xl mt-10 text-center border-b-8 border-yellow-500">
                <h2 class="text-2xl font-bold text-red-900 mb-6">دخول الإدارة المدرسية</h2>
                <input type="password" id="admin-pass" placeholder="كلمة المرور" class="w-full p-3 border-2 rounded-lg mb-4 text-center text-xl outline-none focus:border-yellow-500">
                <button onclick="loginAdmin()" class="w-full red-gradient text-white py-3 rounded-lg font-bold">دخول النظام</button>
            </div>
        </section>

        <section id="admin-dashboard" class="section-content hidden">
            <div class="glass p-6 rounded-2xl shadow-2xl border-t-8 border-red-900">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b pb-4">
                    <h2 class="text-xl font-bold text-red-900 underline decoration-yellow-500">سجل طلبات الاستئذان</h2>
                    <div class="flex flex-wrap gap-2 items-center">
                        <input type="text" id="admin-search" onkeyup="filterTable()" placeholder="بحث باسم الموظف..." class="p-2 border-2 border-gray-200 rounded-lg text-sm outline-none focus:border-yellow-500">
                        <select id="status-filter" onchange="filterTable()" class="p-2 border-2 border-gray-200 rounded-lg text-sm outline-none focus:border-yellow-500">
                            <option value="all">الكل</option>
                            <option value="انتظار">انتظار</option>
                            <option value="مقبول">مقبول</option>
                            <option value="مرفوض">مرفوض</option>
                        </select>
                        <button onclick="showSection('user-form')" class="text-red-600 font-bold border-2 border-red-600 px-4 py-1.5 rounded-lg hover:bg-red-600 hover:text-white transition">خروج</button>
                    </div>
                </div>

                <div class="overflow-x-auto rounded-xl">
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr class="bg-red-900 text-yellow-400">
                                <th class="p-4 text-xs font-bold">الموظف</th>
                                <th class="p-4 text-xs font-bold hide-on-mobile">السبب</th>
                                <th class="p-4 text-xs text-center font-bold">التوقيت</th>
                                <th class="p-4 text-xs text-center font-bold">الحالة</th>
                                <th class="p-4 text-xs text-center font-bold">الإجراء</th>
                            </tr>
                        </thead>
                        <tbody id="requests-table-body" class="bg-white"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <div id="approval-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center p-4 z-[100] backdrop-blur-sm overflow-y-auto">
        <div class="bg-white p-6 rounded-2xl max-w-2xl w-full shadow-2xl border-t-8 border-yellow-500 my-8">
            
            <div id="admin-alert"></div>

            <div id="pdf-content" class="p-4 bg-white text-right mb-4 border-2 border-gray-100 rounded-lg relative">
                <div class="text-center mb-6 border-b-2 border-red-900 pb-4">
                    <h2 class="text-2xl font-bold text-red-900 mb-1">مدرسة محمد بن سليمان الغافري</h2>
                    <h3 class="text-lg font-bold text-gray-700">استمارة استئذان موظف</h3>
                </div>
                
                <div id="modal-details" class="grid grid-cols-2 gap-y-4 gap-x-6 text-sm"></div>
                
                <div class="mt-8 border-t-2 border-gray-200 pt-4 flex justify-between items-end">
                    <div class="text-center w-1/2 flex flex-col items-center">
                        <p class="font-bold text-gray-700 mb-2">توقيع الموظف</p>
                        <div id="emp-sig-display" class="h-16 w-32 flex items-center justify-center">
                            </div>
                    </div>
                    <div class="text-center w-1/2">
                        <p class="font-bold text-red-900 mb-8">يعتمد،، مدير المدرسة</p>
                        <p>........................</p>
                    </div>
                </div>
            </div>

            <textarea id="admin-comment" class="w-full p-3 border-2 rounded-xl mb-4 text-right outline-none focus:border-yellow-500" placeholder="إضافة ملاحظات الإدارة (اختياري)..."></textarea>
            
            <div class="flex flex-wrap gap-2">
                <button onclick="updateStatus('approved')" class="flex-1 bg-green-600 text-white py-2 px-4 rounded-xl font-bold shadow-md hover:bg-green-700 transition">موافقة</button>
                <button onclick="updateStatus('rejected')" class="flex-1 bg-red-600 text-white py-2 px-4 rounded-xl font-bold shadow-md hover:bg-red-700 transition">رفض</button>
                <button onclick="downloadPDF()" class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-xl font-bold shadow-md hover:bg-blue-700 transition flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                    تحميل PDF
                </button>
                <button onclick="deleteCurrentRequest()" class="w-full md:w-auto bg-gray-800 text-white py-2 px-4 rounded-xl font-bold hover:bg-gray-900 transition flex items-center justify-center gap-2">
                    🗑️ حذف الطلب
                </button>
                <button onclick="closeModal()" class="w-full md:w-auto bg-gray-400 text-white py-2 px-6 rounded-xl font-bold hover:bg-gray-500 transition">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnnqOFqhI0Iy0MNEuWGByD0gj4DjP2OMDHnLtV58KxYqXFOU-Xa2j11PGSen1GkBVG/exec"; // <--- تأكد من وضع رابط الـ Deploy هنا
        let currentRequestId = null;
        let globalRequests = []; 

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => console.log('PWA Ready'));
        }

        /* ----- كود لوحة التوقيع مع اختيار اللون ----- */
        const canvas = document.getElementById('sig-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentInkColor = '#000080'; 

        function changeInk(color, btn) {
            currentInkColor = color;
            document.querySelectorAll('.ink-btn').forEach(b => {
                b.classList.remove('ring-2', 'ring-offset-2', 'ring-blue-900', 'ring-black');
            });
            btn.classList.add('ring-2', 'ring-offset-2', color === '#000000' ? 'ring-black' : 'ring-blue-900');
        }

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 500);

        function startPos(e) { isDrawing = true; draw(e); }
        function endPos() { isDrawing = false; ctx.beginPath(); }
        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault(); 
            let rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);
            let x = clientX - rect.left;
            let y = clientY - rect.top;
            
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = currentInkColor; 
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }
        canvas.addEventListener('mousedown', startPos); canvas.addEventListener('mouseup', endPos); canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startPos, {passive: false}); canvas.addEventListener('touchend', endPos); canvas.addEventListener('touchmove', draw, {passive: false});

        function clearSignature() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        
        function getSignatureData() {
            const blank = document.createElement('canvas');
            blank.width = canvas.width; blank.height = canvas.height;
            if(canvas.toDataURL() === blank.toDataURL()) return ""; 
            return canvas.toDataURL('image/png');
        }
        /* -------------------------- */

        function formatTimeClean(timeStr) {
            if (!timeStr) return "--:--";
            let s = String(timeStr);
            if (s.includes('T')) return s.split('T')[1].substring(0, 5);
            return s;
        }

        function formatDateClean(dateStr) {
            if (!dateStr) return "---";
            let d = new Date(dateStr);
            return d.toLocaleDateString('ar-EG');
        }

        function showSection(id) {
            document.querySelectorAll('.section-content').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            if(id === 'user-form') setTimeout(resizeCanvas, 100);
        }

        function showAdminLogin() { showSection('admin-login'); }

        function loginAdmin() {
            if(document.getElementById('admin-pass').value === 'oman26') {
                showSection('admin-dashboard');
                loadRequests();
            } else { alert('كلمة المرور غير صحيحة!'); }
        }

        function toggleTimeFields() {
            const type = document.getElementById('leave-type').value;
            const toDiv = document.getElementById('div-to');
            if(type === 'during') {
                toDiv.classList.remove('hidden');
            } else {
                toDiv.classList.add('hidden');
                document.getElementById('time-to').value = '';
            }
        }

        async function submitRequest() {
            const btn = document.getElementById('btn-submit');
            const data = {
                action: "add",
                id: document.getElementById('perm-id').innerText,
                empId: document.getElementById('emp-id').value,
                empName: document.getElementById('emp-name').value,
                date: document.getElementById('req-date').value,
                type: document.getElementById('leave-type').options[document.getElementById('leave-type').selectedIndex].text,
                reason: document.getElementById('reason').value,
                timeFrom: document.getElementById('time-from').value,
                timeTo: document.getElementById('time-to').value,
                empJob: document.getElementById('emp-job').value,
                empFile: document.getElementById('emp-file').value,
                status: 'pending',
                signature: getSignatureData() 
            };

            if(!data.empName || !data.empId) return alert('يرجى تعبئة البيانات الأساسية');
            btn.disabled = true;
            btn.innerText = "جاري الحفظ في السحابة... ⏳";

            try {
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                alert('تم إرسال الطلب بنجاح ✅');
                location.reload();
            } catch (e) { alert('خطأ في الشبكة'); btn.disabled = false; }
        }

        async function loadRequests() {
            const tbody = document.getElementById('requests-table-body');
            const cachedData = sessionStorage.getItem('schoolRequestsCache');
            if(cachedData) {
                globalRequests = JSON.parse(cachedData);
                filterTable();
            } else {
                tbody.innerHTML = '<tr><td colspan="5" class="p-10 text-center font-bold text-red-900 animate-pulse">جاري جلب السجلات...</td></tr>';
            }

            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                globalRequests = data.reverse(); 
                sessionStorage.setItem('schoolRequestsCache', JSON.stringify(globalRequests));
                filterTable(); 
            } catch (e) { 
                if(!cachedData) tbody.innerHTML = '<tr><td colspan="5" class="p-10 text-center">فشل التحميل، يرجى تحديث الصفحة.</td></tr>'; 
            }
        }

        function filterTable() {
            const searchTerm = document.getElementById('admin-search').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;
            const tbody = document.getElementById('requests-table-body');
            tbody.innerHTML = '';
            
            const filteredData = globalRequests.filter(r => {
                const nameMatch = (r[2] || '').toLowerCase().includes(searchTerm);
                const statusText = r[6] === 'approved' ? 'مقبول' : (r[6] === 'rejected' ? 'مرفوض' : 'انتظار');
                const statusMatch = statusFilter === 'all' || statusText === statusFilter;
                return nameMatch && statusMatch;
            });

            if(filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-gray-500">لا توجد نتائج مطابقة</td></tr>';
                return;
            }

            filteredData.forEach(r => {
                const statusText = r[6] === 'approved' ? 'مقبول' : (r[6] === 'rejected' ? 'مرفوض' : 'انتظار');
                const statusColor = r[6] === 'approved' ? 'text-green-600' : (r[6] === 'rejected' ? 'text-red-600' : 'text-orange-500');
                const timeFrom = formatTimeClean(r[10]);
                const timeTo = formatTimeClean(r[11]);
                const timing = (r[11] && r[11] !== "") ? `${timeFrom} - ${timeTo}` : timeFrom;

                tbody.innerHTML += `
                    <tr class="border-b hover:bg-red-50 transition text-sm">
                        <td class="p-4 font-bold text-red-900">${r[2] || '---'}</td>
                        <td class="p-4 text-gray-600 truncate max-w-[150px] hide-on-mobile">${r[5] || "لم يذكر سبب"}</td>
                        <td class="p-4 text-center font-bold text-blue-800">${timing}</td>
                        <td class="p-4 text-center font-extrabold ${statusColor}">${statusText}</td>
                        <td class="p-4 text-center">
                            <button onclick="openApprovalModal('${r[0]}')" class="bg-red-800 text-white px-4 py-1 rounded-full text-xs shadow-md hover:bg-red-700">التفاصيل</button>
                        </td>
                    </tr>`;
            });
        }

        async function loadEmployeeHistory() {
            const empId = document.getElementById('check-emp-id').value.trim();
            const resultsDiv = document.getElementById('employee-results');
            if(!empId) return alert("يرجى إدخال الرقم الوظيفي");

            resultsDiv.innerHTML = '<p class="text-center font-bold text-red-900 animate-pulse mt-4">جاري البحث في السجلات... ⏳</p>';
            
            try {
                let searchData = globalRequests;
                if(searchData.length === 0) {
                    const response = await fetch(SCRIPT_URL);
                    const data = await response.json();
                    searchData = data.reverse();
                }

                const myRequests = searchData.filter(r => String(r[1]) === empId);

                if(myRequests.length === 0) {
                    resultsDiv.innerHTML = '<div class="bg-red-50 border border-red-200 p-4 rounded-xl text-center text-red-700 font-bold mt-4">لا توجد أي طلبات استئذان مسجلة لهذا الرقم الوظيفي.</div>';
                    return;
                }

                let html = `
                    <div class="mt-6 bg-white border rounded-xl overflow-hidden shadow-sm">
                        <table class="w-full text-sm text-right border-collapse">
                            <thead>
                                <tr class="bg-gray-100 text-red-900 border-b">
                                    <th class="p-3">التاريخ</th>
                                    <th class="p-3">النوع</th>
                                    <th class="p-3">الحالة</th>
                                    <th class="p-3 hide-on-mobile">ملاحظات الإدارة</th>
                                </tr>
                            </thead>
                            <tbody>`;
                
                myRequests.forEach(r => {
                    const statusText = r[6] === 'approved' ? '✅ مقبول' : (r[6] === 'rejected' ? '❌ مرفوض' : '⏳ انتظار');
                    html += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-3 font-bold">${formatDateClean(r[3])}</td>
                            <td class="p-3 text-gray-600">${r[4]}</td>
                            <td class="p-3 font-bold">${statusText}</td>
                            <td class="p-3 text-gray-500 hide-on-mobile">${r[7] || '--'}</td>
                        </tr>`;
                });
                html += `</tbody></table></div>`;
                resultsDiv.innerHTML = html;
            } catch (e) { resultsDiv.innerHTML = '<p class="text-center text-red-500 mt-4">خطأ في الاتصال بالخادم.</p>'; }
        }

        function calculateMonthlyBalance(empId) {
            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();
            const monthlyRequests = globalRequests.filter(r => {
                if(!r[3]) return false;
                const reqDate = new Date(r[3]);
                return String(r[1]) === String(empId) && r[6] === 'approved' && reqDate.getMonth() === currentMonth && reqDate.getFullYear() === currentYear;
            });
            return monthlyRequests.length;
        }

        function openApprovalModal(id) {
            currentRequestId = id;
            const req = globalRequests.find(r => r[0] === id);
            if (!req) return;

            const timeFrom = formatTimeClean(req[10]);
            const timeTo = formatTimeClean(req[11]);
            const timingText = (req[11] && req[11] !== "") ? `من ${timeFrom} إلى ${timeTo}` : timeFrom;

            const balance = calculateMonthlyBalance(req[1]);
            let alertClass = balance >= 3 ? 'bg-red-100 text-red-800 border-red-300' : 'bg-green-50 text-green-800 border-green-200';
            document.getElementById('admin-alert').innerHTML = `
                <div class="p-3 mb-4 rounded-lg border font-bold text-sm flex items-center gap-2 shadow-sm ${alertClass}">
                    <span>📊</span> رصيد الشهر الحالي: استأذن هذا الموظف (${balance}) مرات معتمدة حتى الآن.
                </div>
            `;

            document.getElementById('modal-details').innerHTML = `
                <div class="col-span-2 md:col-span-1 bg-red-50 p-3 rounded border border-red-100"><span class="text-gray-500 block text-xs mb-1">الاسم:</span> <strong class="text-base text-red-900">${req[2] || '---'}</strong></div>
                <div class="col-span-2 md:col-span-1 bg-red-50 p-3 rounded border border-red-100"><span class="text-gray-500 block text-xs mb-1">الرقم الوظيفي:</span> <strong class="text-base text-gray-800">${req[1] || '---'}</strong></div>
                <div class="col-span-1 bg-gray-50 p-3 rounded border"><span class="text-gray-500 block text-xs mb-1">الوظيفة:</span> <strong>${req[8] || '---'}</strong></div>
                <div class="col-span-1 bg-gray-50 p-3 rounded border"><span class="text-gray-500 block text-xs mb-1">رقم الملف:</span> <strong>${req[9] || '---'}</strong></div>
                <div class="col-span-1 bg-gray-50 p-3 rounded border"><span class="text-gray-500 block text-xs mb-1">تاريخ الاستئذان:</span> <strong>${formatDateClean(req[3])}</strong></div>
                <div class="col-span-1 bg-gray-50 p-3 rounded border"><span class="text-gray-500 block text-xs mb-1">نوع الاستئذان:</span> <strong>${req[4] || '---'}</strong></div>
                <div class="col-span-2 bg-yellow-50 p-3 rounded border border-yellow-200"><span class="text-yellow-700 block text-xs mb-1">التوقيت:</span> <strong class="text-lg text-blue-800">${timingText}</strong></div>
                <div class="col-span-2 bg-gray-50 p-3 rounded border"><span class="text-gray-500 block text-xs mb-1">سبب الاستئذان:</span> <p class="text-sm mt-1 leading-relaxed">${req[5] || 'لم يذكر'}</p></div>
                <div class="col-span-2 text-left text-xs text-gray-400 mt-2">رقم الطلب المرجعي: ${req[0]} | وقت التقديم: ${req[12] || '---'}</div>
            `;
            
            const sigDiv = document.getElementById('emp-sig-display');
            if (req[13] && req[13].length > 100) {
                sigDiv.innerHTML = `<img src="${req[13]}" class="max-h-full max-w-full object-contain mix-blend-multiply" style="filter: contrast(1.2) brightness(0.9);">`;
            } else {
                sigDiv.innerHTML = `<span class="text-gray-400 text-[10px] italic border-b border-dashed border-gray-300 pb-1">توقيع يدوي عند الطباعة</span>`;
            }

            document.getElementById('admin-comment').value = req[7] || '';
            document.getElementById('approval-modal').classList.remove('hidden');
        }

        function downloadPDF() {
            const element = document.getElementById('pdf-content');
            const opt = {
                margin:       10,
                filename:     `استئذان_${currentRequestId}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
            };
            html2pdf().set(opt).from(element).save();
        }

        function closeModal() { document.getElementById('approval-modal').classList.add('hidden'); }

        async function updateStatus(status) {
            const comment = document.getElementById('admin-comment').value;
            
            const reqIndex = globalRequests.findIndex(r => r[0] === currentRequestId);
            if(reqIndex > -1) {
                globalRequests[reqIndex][6] = status;
                globalRequests[reqIndex][7] = comment;
                sessionStorage.setItem('schoolRequestsCache', JSON.stringify(globalRequests)); 
                filterTable(); 
            }
            
            closeModal(); 

            const data = { action: "update", id: currentRequestId, status: status, comment: comment };
            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
        }

        // دالة الحذف الجديدة
        async function deleteCurrentRequest() {
            const isConfirmed = confirm('⚠️ تحذير: هل أنت متأكد من حذف هذا الطلب نهائياً؟\nلا يمكن التراجع عن هذا الإجراء وسيتم مسحه من السجلات تماماً.');
            if (!isConfirmed) return;

            const idToDelete = currentRequestId;

            // تحديث وهمي للحذف من الشاشة فوراً
            globalRequests = globalRequests.filter(r => r[0] !== idToDelete);
            sessionStorage.setItem('schoolRequestsCache', JSON.stringify(globalRequests)); 
            filterTable(); 
            closeModal(); 

            // إرسال أمر الحذف للخلفية
            const data = { action: "delete", id: idToDelete };
            try {
                fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            } catch (e) {
                console.error("فشل إرسال طلب الحذف", e);
            }
        }

        document.getElementById('perm-id').innerText = 'PERM-' + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('req-date').valueAsDate = new Date();
    </script>
</body>
</html>
